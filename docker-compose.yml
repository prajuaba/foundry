version: '3.8'

services:
  # ─── MongoDB Database ────────────────────────────────────────────────
  # A single-node replica set, not a standalone.
  #
  # MongoDB only offers multi-document transactions on a replica set, and the repository uses them:
  # the archival sweep moves a year of documents between collections and must not half-move them.
  # Against a standalone that path cannot even be selected -- DataArchivalWorker asks the server
  # whether it supports transactions and falls back to copy-verify-delete -- so for as long as this
  # was a standalone, the transactional path could not run anywhere: not locally, not in CI, not in
  # a test. It was covered by reading it, which this repository has learned is worth very little.
  #
  # One node is enough for transactions; the point is the replica set, not the redundancy.
  mongodb:
    image: mongo:7
    container_name: foundry-mongodb
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      # Initiates on the first probe and reports healthy once a PRIMARY has been elected. The member
      # is addressed as localhost:27017 because the driver reads its host from the replica set
      # configuration, and the tests connect from the host rather than from the network below.
      test: >-
        mongosh --quiet --eval "
          try { rs.status().ok }
          catch (e) {
            rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'localhost:27017'}]}).ok
          }"
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s
    # Without a raised nofile limit, the test suite's per-test databases accumulate open WiredTiger
    # files (each collection and index is a separate .wt file, and dropped databases defer table
    # drops). Over a long run mongod eventually fails to open one more file; WiredTiger panics to
    # avoid corruption risk -- "Too many open files" (errno 24) followed by WT_PANIC. This surfaces
    # as spurious connection-refused failures across other tests still running. MongoDB recommends
    # nofile: 64000 for production workloads; the test suite needs it too.
    ulimits:
      nofile:
        soft: 64000
        hard: 64000
    networks:
      - foundry-network

  # ─── MongoDB, standalone ─────────────────────────────────────────────
  # Deliberately *not* a replica set, and it exists only so the tests have one.
  #
  # DataArchivalWorker has two ways to move a year of documents -- one transaction, or
  # copy-verify-delete -- and it picks by asking the server, so exactly one of the two can execute
  # in any given deployment. Making the service above a replica set fixed the transactional branch
  # and in the same stroke made the fallback the unreachable one: the two swapped places rather
  # than the gap closing.
  #
  # The fallback is what stands between an interrupted sweep and permanent data loss, and it is the
  # branch that runs for every developer who points the framework at a plain mongod. So both shapes
  # are provided, and both are exercised on every run.
  mongodb-standalone:
    image: mongo:7
    container_name: foundry-mongodb-standalone
    ports:
      - "27018:27017"
    volumes:
      - mongodb_standalone_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 5s
    ulimits:
      nofile:
        soft: 64000
        hard: 64000
    networks:
      - foundry-network

  # ─── Mongo Express (Web UI for MongoDB) ──────────────────────────────
  mongo-express:
    image: mongo-express:1.0.2
    container_name: foundry-mongo-express
    depends_on:
      - mongodb
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_SERVER: mongodb
      ME_CONFIG_MONGODB_PORT: 27017
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: password
    networks:
      - foundry-network

  # ─── Kafka Broker (KRaft, no ZooKeeper) ──────────────────────────────
  #
  # This service did not start. It was configured for ZooKeeper against
  # `confluentinc/cp-kafka:latest`, which is KRaft-only in current versions and exits immediately
  # with `environment variable "KAFKA_PROCESS_ROLES" is not set`. Anyone following the README's
  # `docker compose up -d` got a broker that was never there, and nothing depended on it closely
  # enough to notice -- the outbox round trip had never been run.
  #
  # Pinned rather than `latest`, because floating to a new major is what broke it.
  kafka:
    image: confluentinc/cp-kafka:7.7.1
    container_name: foundry-kafka-broker
    ports:
      - "9092:9092"
    environment:
      CLUSTER_ID: foundry-local-cluster-0
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092
      # Two advertised listeners: containers reach the broker as kafka:29092, and the host -- where
      # the tests run -- reaches it as localhost:9092.
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 12
    networks:
      - foundry-network

  # ─── Kafka UI (Web UI for Kafka Broker) ──────────────────────────────
  #
  # Published on 8090, not 8080. 8080 is the most contended port on a developer machine, and when
  # something else already holds it `docker compose up -d` fails for the whole command -- so the
  # stack reads as broken when the only thing that could not start is an optional web UI. The
  # template this repository scaffolds was moved off 8080 for that reason; leaving the framework's
  # own stack on it meant the fix reached adopters and not the people building the framework.
  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: foundry-kafka-ui
    depends_on:
      - kafka
    ports:
      - "8090:8080"
    environment:
      DYNAMIC_CONFIG_ENABLED: 'true'
      KAFKA_CLUSTERS_0_NAME: local-foundry-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    networks:
      - foundry-network

  # ─── OpenTelemetry Collector ─────────────────────────────────────────
  # A development aid to verify that the OpenTelemetry export path actually delivers
  # spans and metrics to a real collector. This is not part of any deployment.
  #
  # It listens on OTLP gRPC (4317) and HTTP (4318) and exports to a debug exporter
  # with detailed verbosity to make trace and metric arrival visible in logs.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.158.0
    container_name: foundry-otel-collector
    ports:
      - "4317:4317"
      - "4318:4318"
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    networks:
      - foundry-network

networks:
  foundry-network:
    driver: bridge

volumes:
  mongodb_data:
    driver: local
  mongodb_standalone_data:
    driver: local
