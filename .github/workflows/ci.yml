name: CI

on:
  push:
    branches: [main, master, 'feature/**']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest

    services:
      # A second MongoDB, deliberately standalone, on 27018.
      #
      # The archival sweep picks between one transaction and copy-verify-delete by asking the server,
      # and MongoDB offers transactions only on a replica set -- so exactly one of those two branches
      # can execute against any given server. Running only the replica set below fixed the
      # transactional branch and made the fallback the unreachable one; the two swapped places rather
      # than the gap closing. Both servers are provided so both branches run on every CI run.
      #
      # A plain mongod needs no post-start command, so it can be an ordinary service container --
      # unlike the replica set, which needs rs.initiate() and therefore a composite action.
      mongodb-standalone:
        image: mongo:7
        ports:
          - 27018:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1}).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12

    steps:
      - uses: actions/checkout@v5

      # FoundryMongo.Tests and the API tests talk to a real MongoDB rather than a mock, and it is a
      # replica set so the transactional archival path can be selected at all.
      - uses: ./.github/actions/mongodb-replica-set

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@v5
        with:
          node-version: '20'

      # Foundry.Cli embeds foundry-studio/dist/index.html. That bundle is a build
      # artifact and is not committed, so it has to be produced before the CLI is
      # compiled -- otherwise CI would silently validate a binary with no Studio in it.
      - name: Build Studio bundle for embedding
        working-directory: foundry-studio
        run: npm ci && npm run build

      - name: Restore
        run: dotnet restore Foundry.slnx

      - name: Build
        run: dotnet build Foundry.slnx --no-restore --configuration Release

      # Covers every suite in the solution: compiler, integration, MongoDB and API. The
      # integration and MongoDB suites talk to the service above rather than mocking it, and
      # GeneratedCodeCompilesTests shells out to a real `dotnet build` over generated output --
      # the only gate that catches emitted C# which reads correctly but does not compile.
      #
      # RequiresKafka is excluded here and run by the outbox job below, which provisions a broker.
      # An explicit filter rather than a skip inside the tests: those suites fail loudly without
      # their infrastructure, so the only place the split is allowed to exist is here, in the open.
      # `!=` still includes every test that declares no category.
      - name: Test
        run: >-
          dotnet test Foundry.slnx --no-build --configuration Release --verbosity normal
          --filter "Category!=RequiresKafka"

  outbox-round-trip:
    name: Outbox round trip
    runs-on: ubuntu-latest

    services:
      # KRaft, no ZooKeeper, pinned. The repository's own docker-compose.yml was configured for
      # ZooKeeper against `cp-kafka:latest`, which is KRaft-only in current versions and exited on
      # startup -- so `docker compose up -d` produced a broker that was never there and nothing
      # depended on it closely enough to notice.
      kafka:
        image: confluentinc/cp-kafka:7.7.1
        ports:
          - 9092:9092
        env:
          CLUSTER_ID: foundry-ci-cluster-0
          KAFKA_NODE_ID: 1
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:29093
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
          KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
          KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
        options: >-
          --health-cmd "kafka-topics --bootstrap-server localhost:9092 --list"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 18
          --health-start-period 30s

    steps:
      - uses: actions/checkout@v5

      # The outbox stores its messages in MongoDB, so this job needs one as much as the others do.
      - uses: ./.github/actions/mongodb-replica-set

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      # The transactional outbox is the framework's durability claim: a mutation is recorded in the
      # same database as the data and published afterwards, so a broker outage cannot lose an event.
      # Every part of that chain had unit tests and the chain itself had never run -- which is how a
      # nested event type came to produce an illegal topic name that failed at the broker while the
      # publisher worker retried it silently forever.
      #
      # These tests fail rather than skip without a broker, so this job cannot pass by doing nothing.
      - name: Outbox round trip against a real broker
        run: >-
          dotnet test foundry-kafka/tests/Foundry.Kafka.IntegrationTests/Foundry.Kafka.IntegrationTests.csproj
          --configuration Release --verbosity normal
          --filter "Category=RequiresKafka"

  runtime-smoke-test:
    name: Runtime smoke test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      # A single-node replica set, so the transactional archival path can be selected at all.
      - uses: ./.github/actions/mongodb-replica-set

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      # The only gate that runs a generated application rather than compiling one. Scaffolds a
      # project with 'foundry new', boots it, exercises the generated REST endpoints, then restarts
      # the process and reads the record back to prove it reached MongoDB. Four defects that a
      # green build could not see -- a circular DI registration, an unresolvable
      # ICurrentUserContext, a Microsoft.OpenApi version mismatch and a POST that could never bind
      # -- were all found this way.
      - name: Scaffold, run and verify a generated application
        run: ./scripts/runtime-smoke-test.sh

  distro-binary:
    name: Distro binary
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      # The script runs `npm ci` itself for the Studio bundle it embeds.
      - uses: actions/setup-node@v5
        with:
          node-version: '20'

      # Nothing in CI published the distributable binary, and `dotnet publish` of it had been
      # failing for some time: the schema compiler is an executable project, and reaching it
      # through a RID-agnostic library made a self-contained publish evaluate it a second time
      # without the RID, so two builds collided on their apphost and deps.json. Every other job
      # here was green throughout. `dotnet build` does not exercise the publish graph, so the one
      # artifact users actually install was the one thing no gate touched.
      #
      # One RID is enough to catch that class -- the failure was in the shape of the project graph,
      # not in anything platform-specific -- so this does not matrix over macOS and Windows, whose
      # runners cost several times more per minute. A RID-specific packaging break would still get
      # through; that is a deliberate trade, not an oversight.
      #
      # The script publishes and then runs the binary: version, the non-zero exit on no arguments,
      # validate, schema build, and serving the embedded Studio page. That last one is the reason a
      # build step alone would not be enough -- the Studio bundle is embedded as a resource and its
      # absence is only an MSBuild warning, so a publish that omits it succeeds and ships a CLI
      # whose `foundry studio` command silently does nothing.
      - name: Publish and verify the foundry binary
        run: bash scripts/build-distro.sh linux-x64

      # Uploaded only for main, where it is the build someone might actually want to install.
      # Pull requests get the verification without paying to store a 60 MB artifact per run.
      - name: Upload binary
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: foundry-linux-x64
          path: dist-bin/foundry
          retention-days: 14
          if-no-files-found: error

  schema-gates:
    name: Schema gates
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Build CLI
        run: dotnet build foundry-cli/src/Foundry.Cli/Foundry.Cli.csproj --configuration Release

      # Non-zero exit on any error, so a schema that would generate broken or empty
      # output fails the build rather than being discovered later.
      - name: Validate sample schemas
        run: |
          CLI="foundry-cli/src/Foundry.Cli/bin/Release/net10.0/foundry.dll"
          dotnet "$CLI" validate samples/Foundry.E2E.Showcase/e2e-schema.ir.json

      # The bundle is generated from compiler source. Regenerating it here proves the
      # generator still runs and that every shipped golden example still validates —
      # a stale example teaches a model to emit IR the compiler rejects.
      - name: Regenerate AI skill bundle and validate its examples
        run: |
          CLI="foundry-cli/src/Foundry.Cli/bin/Release/net10.0/foundry.dll"
          dotnet "$CLI" ai-spec --out /tmp/foundry-skill
          for f in /tmp/foundry-skill/examples/*.json; do
            echo "validating $f"
            dotnet "$CLI" validate "$f"
          done

  vscode-extension:
    name: VS Code extension
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: foundry-vscode

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '20'

      # The extension had no gate of any kind: not built, not typechecked, not run. It shipped a
      # compile command whose arguments the compiler rejects, a "new schema" command that wrote a
      # document the compiler refuses, and a README claim of LSP integration with no language client
      # in it. None of that is visible to a typecheck alone, which is why the tests below exist -- but
      # a component nothing builds is one nobody notices breaking either.
      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Bundle
        run: npm run build

  studio:
    name: Studio tests and typecheck
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: foundry-studio

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Install
        run: npm ci

      # Studio is the second producer of api-manifest.json, alongside the C# compiler. These tests
      # pin its output to the compiler's contract: the two previously disagreed on the route prefix
      # and on whether an entity with no declared methods gets full CRUD, so the same domain model
      # produced two different APIs with nothing reporting a conflict.
      - name: Test
        run: npm test

      - name: Typecheck and build
        run: npm run build

# The local-model eval (`foundry eval`) is deliberately not run here. It needs an
# Ollama host with the model resident, which a hosted runner does not have. Run it
# locally against a real model before changing the IR schema, the vocabulary or the
# system prompt:
#
#     foundry eval --runs 3 --min-pass 0.9 --out eval.md
#
# Prompt and schema edits do not compose freely — a change that fixes one construct
# can measurably degrade another, so re-measure rather than assuming.
